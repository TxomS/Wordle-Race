# Fixed project name, so volume and network names do not depend on the folder
# the repository was cloned into.
name: wordle-race

services:
  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      DB_PATH: /data/wordle.db
      PRESENCE_TIMEOUT_SECONDS: ${PRESENCE_TIMEOUT_SECONDS:-15}
      GAME_TTL_MINUTES: ${GAME_TTL_MINUTES:-15}
      FINISHED_GAME_TTL_MINUTES: ${FINISHED_GAME_TTL_MINUTES:-2}
      LOBBY_MAX_WAIT_MINUTES: ${LOBBY_MAX_WAIT_MINUTES:-15}
      LOBBY_SILENCE_MINUTES: ${LOBBY_SILENCE_MINUTES:-2}
      SWEEP_EVERY_MINUTES: ${SWEEP_EVERY_MINUTES:-1}
    volumes:
      - wordle-data:/data
      # The word lists are mounted from the repository so they can be edited without
      # rebuilding: change backend/data/answers.txt, then `docker compose restart backend`.
      - ./backend/data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      # 127.0.0.1 on purpose: "localhost" may resolve to IPv6, where nginx is not listening.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  # Run by `make test`. Not started by `make setup`, because of the "test" profile.
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test

  # Also run by `make test`: builds the site, tests it, and checks that no word list
  # ended up inside the JavaScript. The word lists are mounted read-only for that check.
  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test
    volumes:
      - ./backend/data:/words:ro

volumes:
  wordle-data:
