server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers (also repeated in `location /`, because a location that
    # sets its own add_header does not inherit these).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's built-in DNS. Using a variable in proxy_pass makes nginx look the
    # backend up on every request (cached for 10 s) instead of once at startup,
    # so the site keeps working when the backend container is restarted.
    resolver 127.0.0.11 valid=10s;

    # /api/* goes to the Python backend, with the original URI passed through.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Fail fast when the backend is down. The defaults wait 60 s on the address of a
        # stopped container, which would leave the page hanging instead of showing
        # "Reconnecting..." within a few seconds.
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    # The page itself (index.html) is always checked with the server before it is used, so a
    # new build shows up on the next reload instead of an old copy staying in the browser.
    # Requests for "/" and for game links like /g/ABCDE end up here too.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    }

    # Scripts and styles have names that change with every build (like index-DBrP7ywW.js), so
    # a browser may keep them for a year. A name that does not exist is a real 404, never the
    # page: otherwise an old page asking for an old script would get HTML back and show nothing.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Everything else is the React app. Unknown paths (such as /g/ABCDE, a game
    # link) fall back to index.html so refreshing on a game URL works.
    location / {
        try_files $uri /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        # The app loads only its own files. 'unsafe-inline' for styles is needed because
        # React sets a few inline style attributes (the tile flip delay). Not applied to
        # /api, whose interactive docs page loads its viewer from a CDN.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    }
}
