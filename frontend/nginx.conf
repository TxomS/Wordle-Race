server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's built-in DNS. Using a variable in proxy_pass makes nginx look the
    # backend up on every request (cached for 10 s) instead of once at startup,
    # so the site keeps working when the backend container is restarted.
    resolver 127.0.0.11 valid=10s;

    # /api/* goes to the Python backend, with the original URI passed through.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Fail fast when the backend is down. The defaults wait 60 s on the address of a
        # stopped container, which would leave the page hanging instead of showing
        # "Reconnecting..." within a few seconds.
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    # Everything else is the React app. Unknown paths (such as /g/ABCDE, a game
    # link) fall back to index.html so refreshing on a game URL works.
    location / {
        try_files $uri /index.html;
    }
}
